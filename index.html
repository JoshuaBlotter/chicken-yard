<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Barnyard Toys</title>
<!-- Installable web app (Add to Home Screen -> fullscreen, offline) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7FA65C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barnyard">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* farm sky above, grass below */
  body {
    background: linear-gradient(#BFE3EA 0%, #DDF0F2 42%, #9EC46E 42%, #7FA65C 100%);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4vmin; padding: 5vmin;
  }
  h1 {
    margin: 0; font-size: clamp(22px, 6vmin, 54px); font-weight: 800;
    color: #4b5d3a; letter-spacing: .5px; text-align: center;
    text-shadow: 0 2px 0 rgba(255,255,255,.5);
  }
  .cards {
    display: flex; gap: 4vmin; width: 100%;
    align-items: stretch; justify-content: center;
    flex-wrap: wrap;
  }
  a.card {
    flex: 1 1 340px; max-width: 460px; min-width: 260px;
    text-decoration: none; color: inherit;
    border-radius: 28px; overflow: hidden;
    background: #fff; border: 5px solid #ffffff;
    box-shadow: 0 12px 30px rgba(0,0,0,.22);
    display: flex; flex-direction: column;
    transition: transform .08s ease;
    outline: none;
  }
  a.card:active { transform: scale(.97); }
  a.card .art { display: block; width: 100%; aspect-ratio: 16 / 10; }
  a.card .label {
    padding: 3vmin; text-align: center;
    font-size: clamp(20px, 4.2vmin, 34px); font-weight: 800;
  }
  .chicken .label { background: #F1E4C7; color: #7a4a2a; }
  .duck .label    { background: #CFE9E9; color: #256066; }
  .garden .label  { background: #DCEAC8; color: #4b6b2f; }
  @media (orientation: portrait) { .cards { flex-direction: column; align-items: center; } a.card { flex: 0 0 auto; width: 100%; } }
</style>
</head>
<body>
  <h1>Choose a toy</h1>
  <div class="cards">

    <!-- CHICKEN YARD -->
    <a class="card chicken" href="chicken-yard.html" aria-label="Chicken Yard">
      <svg class="art" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- sky + grass -->
        <rect width="320" height="200" fill="#CDE9F5"/>
        <rect y="120" width="320" height="80" fill="#7FA65C"/>
        <rect y="150" width="320" height="50" fill="#C8A97E"/>
        <ellipse cx="60" cy="45" rx="34" ry="16" fill="#ffffff" opacity=".85"/>
        <ellipse cx="86" cy="40" rx="26" ry="14" fill="#ffffff" opacity=".85"/>
        <!-- a plump hen -->
        <g transform="translate(150 96)">
          <ellipse cx="0" cy="60" rx="60" ry="12" fill="#000" opacity=".12"/>
          <path d="M-52 20 Q-70 -6 -40 -18 Q-30 -46 6 -44 Q54 -44 60 2 Q66 40 20 50 Q-40 56 -52 20 Z" fill="#F6F3EC"/>
          <path d="M-52 20 Q-30 34 6 34 Q40 34 58 14 Q66 40 20 50 Q-40 56 -52 20 Z" fill="#E7E1D3"/>
          <!-- wing -->
          <path d="M-30 -6 Q4 -20 34 -2 Q10 18 -24 12 Z" fill="#E0D6C2"/>
          <!-- head + comb + wattle -->
          <circle cx="22" cy="-46" r="20" fill="#F6F3EC"/>
          <path d="M8 -60 q6 -12 12 0 q6 -12 12 0 q6 -10 10 2 q-14 8 -34 4 Z" fill="#D6403A"/>
          <path d="M20 -30 q-4 12 6 12 q6 -2 2 -12 Z" fill="#D6403A"/>
          <!-- beak + eye -->
          <path d="M40 -46 l18 -5 l-16 12 Z" fill="#E8A33D"/>
          <circle cx="28" cy="-49" r="3.2" fill="#222"/>
          <!-- legs -->
          <path d="M2 48 l0 16 M-4 64 l12 0 M-16 48 l0 16 M-22 64 l12 0" stroke="#E8A33D" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <!-- feed pecks -->
        <g fill="#E8CE8A"><circle cx="70" cy="176" r="3"/><circle cx="86" cy="182" r="3"/><circle cx="250" cy="180" r="3"/><circle cx="236" cy="174" r="3"/></g>
      </svg>
      <div class="label">Chicken Yard</div>
    </a>

    <!-- DUCK POND -->
    <a class="card duck" href="duck-pond.html" aria-label="Duck Pond">
      <svg class="art" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- grassy bank + pond -->
        <rect width="320" height="200" fill="#7FA65C"/>
        <ellipse cx="160" cy="108" rx="150" ry="86" fill="#58A0A0"/>
        <ellipse cx="160" cy="112" rx="120" ry="66" fill="#2E6B72"/>
        <!-- ripple glints -->
        <g stroke="#EAFBFF" stroke-width="2.5" fill="none" opacity=".5" stroke-linecap="round">
          <path d="M60 70 q12 -6 24 0"/><path d="M210 150 q14 -6 28 0"/><path d="M96 150 q10 -5 20 0"/>
        </g>
        <!-- lily pad -->
        <path d="M70 118 a24 24 0 1 1 10 6 Z" fill="#4E8C4A"/>
        <circle cx="78" cy="120" r="5" fill="#F7F1E3"/>
        <!-- a drake -->
        <g transform="translate(178 96)">
          <ellipse cx="-4" cy="26" rx="52" ry="10" fill="#000" opacity=".10"/>
          <path d="M-46 6 Q-58 -14 -30 -18 Q40 -24 46 6 Q40 24 -6 24 Q-42 24 -46 6 Z" fill="#9A8A72"/>
          <path d="M20 6 Q46 4 46 6 Q40 24 8 24 Q6 12 20 6 Z" fill="#7A3B2E"/>
          <!-- folded wing + speculum -->
          <path d="M-30 0 Q0 -12 26 2 Q0 14 -26 8 Z" fill="#877962"/>
          <path d="M-24 4 l22 -4" stroke="#3A6FB0" stroke-width="3"/>
          <!-- curled tail -->
          <path d="M-44 0 q-10 -8 -4 -12 q6 2 6 10 Z" fill="#2E6B4F"/>
          <!-- neck + green head -->
          <path d="M28 4 Q30 -10 40 -14 L46 -6 Q40 4 38 12 Z" fill="#9A8A72"/>
          <circle cx="42" cy="-16" r="14" fill="#2E6B4F"/>
          <ellipse cx="40" cy="-20" r="6" rx="6" ry="5" fill="#ffffff" opacity=".14"/>
          <path d="M54 -16 l16 -3 l-15 8 Z" fill="#E8A33D"/>
          <circle cx="46" cy="-19" r="2.6" fill="#111"/>
        </g>
        <!-- reeds -->
        <g stroke="#6B8F3E" stroke-width="4" fill="none" stroke-linecap="round">
          <path d="M300 168 Q302 130 298 104"/><path d="M310 170 Q314 136 310 112"/>
        </g>
        <ellipse cx="298" cy="102" rx="4" ry="11" fill="#7A5230"/>
      </svg>
      <div class="label">Duck Pond</div>
    </a>

    <!-- GROW A GARDEN -->
    <a class="card garden" href="garden.html" aria-label="Grow a Garden">
      <svg class="art" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- sky + soil cutaway -->
        <rect width="320" height="200" fill="#8FD3E8"/>
        <rect width="320" height="124" fill="url(#gsky)"/>
        <defs><linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3E8"/><stop offset="1" stop-color="#DCEFF2"/></linearGradient></defs>
        <circle cx="264" cy="40" r="22" fill="#FFD98A"/>
        <path d="M0 100 Q80 74 160 96 Q240 116 320 92 L320 124 L0 124 Z" fill="#9DB0A8"/>
        <rect y="124" width="320" height="76" fill="#4A3626"/>
        <rect y="150" width="320" height="50" fill="#6B4E36"/>
        <!-- a sunflower -->
        <g transform="translate(120 124)">
          <path d="M0 0 Q-6 -40 0 -78" stroke="#5C8F3A" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M-2 -30 Q-30 -34 -40 -20 Q-20 -14 -2 -26 Z" fill="#6FA844"/>
          <path d="M2 -46 Q30 -52 42 -38 Q22 -30 2 -42 Z" fill="#8CC45C"/>
          <g transform="translate(0 -84)">
            <g fill="#F2B830"><ellipse cx="0" cy="-16" rx="5" ry="12"/><ellipse cx="0" cy="16" rx="5" ry="12"/><ellipse cx="-16" cy="0" rx="12" ry="5"/><ellipse cx="16" cy="0" rx="12" ry="5"/><ellipse cx="-11" cy="-11" rx="10" ry="5" transform="rotate(45 -11 -11)"/><ellipse cx="11" cy="11" rx="10" ry="5" transform="rotate(45 11 11)"/><ellipse cx="11" cy="-11" rx="10" ry="5" transform="rotate(-45 11 -11)"/><ellipse cx="-11" cy="11" rx="10" ry="5" transform="rotate(-45 -11 11)"/></g>
            <circle cx="0" cy="0" r="11" fill="#7a5a34"/>
          </g>
          <!-- roots in the cutaway -->
          <path d="M0 2 Q-4 22 -14 40 M0 2 Q6 20 4 44 M0 2 Q10 18 22 34" stroke="#7d6247" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
        <!-- a carrot: greens up, orange root below -->
        <g transform="translate(232 124)">
          <path d="M0 -2 Q-10 -22 -16 -34 M0 -2 Q0 -24 0 -38 M0 -2 Q10 -22 16 -34" stroke="#8CC45C" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M-8 0 Q-9 26 0 44 Q9 26 8 0 Z" fill="#E07B29"/>
        </g>
        <!-- worm -->
        <path d="M60 176 q10 -8 22 -2 q10 6 22 -2" stroke="#E0A0A0" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="label">Grow a Garden</div>
    </a>

  </div>

<script>
  // Prevent stray gestures navigating away; keep it kiosk-like for a toddler.
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("gesturestart", e => e.preventDefault());
  // register the shared service worker so both toys work fully offline
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
</body>
</html>
